services:
  ball_follower:
    build: .
    network_mode: host    # = --network=host
    ipc: host             # = --ipc=host
    device_cgroup_rules:
      - 'c 81:* rmw'    # сamera
      - 'c 189:* rmw'    # also сamera
      - 'c 166:* rmw'   # serial port (arduino)
      - 'c 188:* rmw'   # serial port
    group_add: [video, dialout]
    volumes:
      - /dev:/dev

    restart: unless-stopped